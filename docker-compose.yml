services:
  mysql:
    image: mysql:8.0
    container_name: t4-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: schoolservice
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - t4-network

  mongo:
    image: mongo:7
    container_name: t4-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - t4-network

  service-registry:
    build: ./service-registry
    container_name: t4-service-registry
    ports:
      - "8761:8761"
    networks:
      - t4-network

  school-service:
    build: ./school.service
    container_name: t4-school-service
    environment:
      MYSQL_HOST: mysql
      EUREKA_HOST: service-registry
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - t4-network

  student-service:
    build: ./student.service
    container_name: t4-student-service
    environment:
      MONGO_HOST: mongo
      EUREKA_HOST: service-registry
    depends_on:
      mongo:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - t4-network

  api-gateway:
    build: ./api-gateway
    container_name: t4-api-gateway
    environment:
      EUREKA_HOST: service-registry
    depends_on:
      service-registry:
        condition: service_started
      school-service:
        condition: service_started
      student-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - t4-network

networks:
  t4-network:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
